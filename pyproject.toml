[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markmem"
version = "0.1.0"
description = "Selbst-lernendes, selbst-tunendes KI-Gedächtnis auf Markdown+git — HybridRAG, Lern-Schleife, responsives Terminal-Dashboard (memDash)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["memory", "rag", "retrieval", "embeddings", "ollama", "markdown", "agent-memory", "tui", "dashboard"]
authors = [{ name = "markmem contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = []  # Kern = pure stdlib

[project.optional-dependencies]
vektor = ["numpy>=1.24", "wcwidth>=0.2"]
rerank = ["torch>=2.0", "transformers>=4.30"]
dev = ["pytest>=7", "ruff>=0.4"]
all = ["markmem[vektor,rerank]"]

[project.urls]
Homepage = "https://github.com/markmem/markmem"
Documentation = "https://github.com/markmem/markmem/tree/main/docs"

[project.scripts]
memdash = "markmem.core.dashboard:main"
markmem-index = "markmem.core.embed_memories:main"
markmem-retrieve = "markmem.core.memory_retrieve:main"
markmem-compact = "markmem.core.memory_compact:main"
markmem-tier = "markmem.core.memory_tier:main"
markmem-eval = "markmem.eval.eval_retrieval:main"
markmem-tune = "markmem.eval.tune_retrieval:main"
markmem-corrections = "markmem.learn.correction_synapse:main"
markmem-deadends = "markmem.learn.deadend_catalog:main"
markmem-graph = "markmem.learn.graph_densify:main"
markmem-audit = "markmem.ops.memory_audit:main"
markmem-status = "markmem.ops.memory_status:main"
markmem-contextscore = "markmem.ops.memory_context_score:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markmem"]

[tool.hatch.build.targets.sdist]
include = ["src/markmem", "examples", "eval", "docs", "integrations", "scripts", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Explicit, reproducible policy -- CI blocks on exactly this, so no ruff-version drift
# silently changes what "clean" means. We gate on DEFECT-level rules, not cosmetics:
#   F   pyflakes          (undefined names, unused imports/vars, broken f-strings)
#   I   isort             (import order)
#   E9  pycodestyle       (syntax errors)
#   B   flake8-bugbear    (real bug smells: loop-var closures B023, duplicate values B033)
# Deliberately NOT gated -- cosmetic or a disclosed design choice, not a defect:
#   E501 line length, E741 single-char names -- pure style; repo-wide reflow/rename would be
#        churn without correctness gain (line-length stays a soft target, see [tool.ruff]).
#   BLE001 / S110 / S112 / E722 -- fail-open IS the design (see THREAT_MODEL.md): optional
#        legs (Ollama, numpy, OTel, git) degrade to None/[]/skip rather than raise.
#   EXE001 -- importable modules carry a conventional shebang without +x.
select = ["F", "I", "E9", "B"]
ignore = [
    "B007",  # unused loop var -- cosmetic (would force _-prefix churn across many loops)
    "B905",  # zip() strict= -- behaviour-neutral here; adding it repo-wide is drive-by churn
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rerank: braucht torch/transformers (skip ohne)", "ollama: braucht laufenden Ollama"]

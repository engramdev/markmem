<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="markmem — selbst-lernendes KI-Gedächtnis auf Markdown + git">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgb(120,215,250)"/>
      <stop offset="1" stop-color="rgb(70,180,230)"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="rgb(26,32,40)"/>
      <stop offset="0.6" stop-color="rgb(20,25,32)"/>
      <stop offset="1" stop-color="rgb(15,18,23)"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund + dezente Vignette -->
  <rect x="0" y="0" width="1280" height="640" fill="rgb(18,22,28)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#vignette)"/>

  <!-- feines Grid-Motiv (sehr dezent, nur linke obere Andeutung von Struktur) -->
  <g stroke="rgb(90,200,245)" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- innerer Rahmen -->
  <rect x="24.5" y="24.5" width="1231" height="591" rx="18" ry="18" fill="none" stroke="rgb(70,120,145)" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- Terminal-Prompt-Glyph, oben links -->
  <text x="96" y="118" font-family="ui-monospace,'DejaVu Sans Mono',monospace" font-size="40" font-weight="700" fill="rgb(90,200,245)" opacity="0.9">&#8250;</text>

  <!-- ASCII-Block-Wortmarke "markmem" (█▀▄), cyan, terminal-logo-Stil — wie banner.svg, vergrößert -->
  <text font-family="ui-monospace,'DejaVu Sans Mono',monospace" font-size="36" font-weight="700" fill="url(#cyan)" xml:space="preserve" letter-spacing="0"><tspan x="150" y="172">█   █   ███   ████   █   █  █   █  █████  █   █</tspan><tspan x="150" y="212">██ ██  █   █  █   █  █  █   ██ ██  █      ██ ██</tspan><tspan x="150" y="252">█ █ █  █████  ████   ███    █ █ █  ███    █ █ █</tspan><tspan x="150" y="292">█   █  █   █  █  █   █  █   █   █  █      █   █</tspan><tspan x="150" y="332">█   █  █   █  █   █  █   █  █   █  █████  █   █</tspan></text>

  <!-- cyan Akzent-Strich unter der Wortmarke -->
  <rect x="152" y="364" width="976" height="3" rx="1.5" fill="url(#cyan)" opacity="0.85"/>

  <!-- Tagline -->
  <text x="152" y="416" font-family="ui-monospace,'DejaVu Sans Mono',monospace" font-size="27" letter-spacing="0.5" fill="rgb(230,236,246)">Selbst-lernendes KI-Ged&#228;chtnis auf Markdown + git</text>

  <!-- Feature-Chips (abgerundete Pills) -->
  <g font-family="ui-monospace,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700">
    <!-- HybridRAG (cyan) -->
    <rect x="152" y="462" width="186" height="48" rx="24" fill="rgb(90,200,245)" fill-opacity="0.12" stroke="rgb(90,200,245)" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="245" y="494" text-anchor="middle" fill="rgb(90,200,245)">HybridRAG</text>
    <!-- Lern-Schleife (grün) -->
    <rect x="356" y="462" width="208" height="48" rx="24" fill="rgb(95,215,135)" fill-opacity="0.12" stroke="rgb(95,215,135)" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="460" y="494" text-anchor="middle" fill="rgb(95,215,135)">Lern-Schleife</text>
    <!-- Self-Tuning (gelb) -->
    <rect x="582" y="462" width="184" height="48" rx="24" fill="rgb(240,195,90)" fill-opacity="0.12" stroke="rgb(240,195,90)" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="674" y="494" text-anchor="middle" fill="rgb(240,195,90)">Self-Tuning</text>
    <!-- memDash (info-blau) -->
    <rect x="784" y="462" width="160" height="48" rx="24" fill="rgb(125,170,245)" fill-opacity="0.12" stroke="rgb(125,170,245)" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="864" y="494" text-anchor="middle" fill="rgb(125,170,245)">memDash</text>
  </g>

  <!-- Fußzeile: Lizenz / Python / fail-open -->
  <text x="152" y="566" font-family="ui-monospace,'DejaVu Sans Mono',monospace" font-size="20" letter-spacing="0.5" fill="rgb(138,147,160)">MIT &#183; Python 3.10+ &#183; fail-open</text>

  <!-- dezentes Dashboard-Balken-Motiv rechts unten (memDash-Andeutung, Recall-Treppe) -->
  <g transform="translate(986,402)">
    <!-- Rahmen-Andeutung eines Panels -->
    <rect x="0" y="0" width="216" height="190" rx="12" fill="rgb(90,200,245)" fill-opacity="0.03" stroke="rgb(70,120,145)" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- aufsteigende Balken (Recall@1-Treppe), Palette-Farben -->
    <rect x="28"  y="128" width="24" height="36"  rx="3" fill="rgb(138,147,160)" fill-opacity="0.65"/>
    <rect x="62"  y="106" width="24" height="58"  rx="3" fill="rgb(125,170,245)" fill-opacity="0.7"/>
    <rect x="96"  y="80"  width="24" height="84"  rx="3" fill="rgb(240,195,90)"  fill-opacity="0.7"/>
    <rect x="130" y="56"  width="24" height="108" rx="3" fill="rgb(95,215,135)"  fill-opacity="0.8"/>
    <rect x="164" y="36"  width="24" height="128" rx="3" fill="rgb(90,200,245)"  fill-opacity="0.9"/>
    <!-- Sparkline über den Balken -->
    <polyline points="40,128 74,108 108,84 142,60 176,40" fill="none" stroke="rgb(90,200,245)" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="176" cy="40" r="4" fill="rgb(90,200,245)"/>
  </g>
</svg>

name: ci

# Test-Matrix über Python 3.11/3.12/3.13. Kein Ollama im CI — die Vektor-/LLM-
# abhängigen Tests sind per Marker (ollama/rerank) ausgeschlossen bzw. fail-open.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (vektor + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vektor,dev]"

      - name: Lint (ruff, nicht blockierend)
        run: ruff check src/ || true

      - name: Tests (ohne Ollama/Rerank)
        run: pytest -m "not ollama and not rerank" -q
